<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Portfolio | Aditya Rajput</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="sidebar">
        <h1 class="logo">Portfolio</h1>
        <p class="section-label">overview</p>
        <nav>
            <ul>
                <li ><a href="#home" class="nav-link active">HOME</a></li>
            </ul>
        </nav>
        <p class="section-label">my</p>
        <nav>
            <ul>
                <li ><a href="#achievements" class="nav-link">Achievements</a></li>
                <li ><a href="#skills" class="nav-link">Skills</a></li>
                <li ><a href="#projects" class="nav-link">Projects</a></li>
                <li ><a href="#setup" class="nav-link">Setup</a></li>
            </ul>
        </nav>
        <p class="section-label">contact</p>
        <nav>
            <ul>
                <li ><a href="#social" class="nav-link">Links</a></li>
            </ul>
        </nav>
    </div>
    <div class="top-bar">
        <div class="top-bar-left">
            <span class="welcome-text">Ciao, </span>
        </div>
        <div class="top-bar-right">
            <button class="theme">Dark-Mode</button>
            <button class="email-btn">Email Me</button>

        </div>
    </div>
    <div class="main-content">
        <h2 class="greeting">Welcome Visitor, </h2>
        <div class="card my-name-card">
            <span class="card-label">My-Name</span>
            <div class="card-content">
                <h1 class="my-name">Aditya Rajput</h1>
                <span class="about">- Creative Developer</span>
            </div>
        </div>
        <div class="info-cards">
            <div class="card age-card">
                <span class="card-label">Age</span>
                <div class="card-content">
                    <h3 class="card-value">17</h3>
                </div>
            </div>
            <div class="card hobby-card">
                <span class="card-label">Hobby</span>
                <div class="card-content">
                    <h3 class="card-value">Building Stuff</h3>
                </div>
            </div>
            <div class="card nature-card">
                <span class="card-label">Nature</span>
                <div class="card-content">
                    <h3 class="card-value">Kinda Introvert</h3>
                </div>
            </div>
            <div class="card love-to-card">
                <span class="card-label">Loves to</span>
                <div class="card-content">
                    <h3 class="card-value">Contribute Opensource</h3>
                </div>
            </div>

        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
